    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Secret Santa Generator",
        "url": "https://secret-santa-generator.correia95.workers.dev/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Generates Secret Santa gift-exchange pairings (a random derangement with no self-matches) from a list of names, supporting exclusion pairs such as couples who shouldn't draw each other, revealed one person at a time on the same device."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does this send anything to participants automatically?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No - nothing is emailed or messaged. You reveal each person's match on this page and tell them yourself, however you'd like."
            }
          },
          {
            "@type": "Question",
            "name": "What if my exclusions make a draw impossible?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "With too many exclusions relative to the group size, no valid arrangement may exist - you'll see a message asking you to remove one or add more participants."
            }
          },
          {
            "@type": "Question",
            "name": "Is my list stored anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Only in this browser and, if you copy it, the organizer link's URL. Nothing is uploaded to a server."
            }
          }
        ]
      }
    </script>
